// Load logo lembaga untuk topbar

  google.script.run

      if (!wrap) return;

        wrap.outerHTML = '<img id="topbarLogoWrap" class="topbar-logo" src="' + res.dataUrl + '" alt="Logo">';

// ---- Helper tanggal (format kunci: yyyy-MM-dd) ----
function pad2(n) { return ('0' + n).slice(-2); }
function dateToKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function keyToDate(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function keyToDisplay(k) { if (!k) return '-'; var p = k.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function todayKey() { return dateToKey(new Date()); }
function getHariFromDate(k) { return hariMap[keyToDate(k).getDay()] || ''; }
function statusKey(idJadwal, dk) { return idJadwal + '|' + dk; }

// Tanggal terakhir (hari ini atau sebelumnya) yang jatuh pada nama hari tsb
function lastDateForHari(hari) {
  var d = new Date();
  for (var i = 0; i < 7; i++) {
    if (hariMap[d.getDay()] === hari) return dateToKey(d);
    d.setDate(d.getDate() - 1);
  }
  return todayKey();
}

// ==============================
// LOAD DATA
// ==============================
function loadJadwal() {
  document.getElementById('jadwalContainer').innerHTML = '<div class="loader-wrap"><div class="spinner"></div><span style="font-size:13px">Memuat jadwal...</span></div>';
  google.script.run
    .withSuccessHandler(function(jadwals) {
      semuaJadwal = jadwals || [];
      // Ambil status absensi (per jadwal + tanggal sesi) untuk mencegah absen ganda
      google.script.run
        .withSuccessHandler(function(list) {
          buildStatusMap(list);
          rerender();
        })
        .withFailureHandler(function() { rerender(); })
        .getStatusAbsensiTutor();
    })
    .withFailureHandler(function(err) {
      document.getElementById('jadwalContainer').innerHTML = '<div class="empty-card"><span class="material-symbols-outlined empty-icon">wifi_off</span><div class="empty-title">Gagal Memuat Jadwal</div><div class="empty-sub">' + escHtml(err.message) + '</div></div>';
    })
    .getAllJadwalWithNames();
}

function buildStatusMap(list) {
  absensiStatus = {};
  (list || []).forEach(function(a) {
    if (!a.ID_Jadwal || !a.Tanggal_Sesi) return;
    var k = statusKey(a.ID_Jadwal, a.Tanggal_Sesi);
    // Status selain 'Ditolak' lebih diutamakan (berarti sesi sudah tercatat)
    if (!absensiStatus[k] || absensiStatus[k] === 'Ditolak') absensiStatus[k] = a.Status_Verifikasi || 'Menunggu';
  });
}

// Render ulang tampilan aktif (mode hari ATAU mode cari tanggal)
function rerender() {
  if (dateSearchActive) searchByDate(true);
  else renderJadwal();
}

// ==============================
// SEARCH BY DATE
// ==============================
function searchByDate(silent) {
  var dateInput = document.getElementById('filterTanggal').value; // yyyy-MM-dd
  if (!dateInput) { if (!silent) showToast('Pilih tanggal dulu.', 'error'); return; }

  var hari = getHariFromDate(dateInput);
  if (!hari) return;

  dateSearchActive = true;

  // Deactivate day buttons
  var btns = document.querySelectorAll('.day-btn');
  btns.forEach(function(b) { b.className = 'day-btn'; });

  // Filter jadwal by hari name of the selected date
  var filtered = semuaJadwal.filter(function(j) {
    return matchJadwalTanggal(j, hari, dateInput);
  });

  renderJadwalList(filtered, dateInput, hari);
}

function resetDateSearch() {
  document.getElementById('filterTanggal').value = '';
  dateSearchActive = false;
  activeHariFilter = 'hari-ini';
  var btns = document.querySelectorAll('.day-btn');
  btns.forEach(function(b) { b.className = 'day-btn'; });
  document.getElementById('btn-hari-ini').className = 'day-btn active';
  renderJadwal();
}

// ==============================
// RENDER JADWAL
// ==============================
function setHariFilter(hari) {
  dateSearchActive = false;
  document.getElementById('filterTanggal').value = '';
  activeHariFilter = hari;
  var btns = document.querySelectorAll('.day-btn');
  btns.forEach(function(b) { b.className = 'day-btn'; });

  if (hari === 'hari-ini') {
    document.getElementById('btn-hari-ini').className = 'day-btn active';
  } else {
    btns.forEach(function(b) {
      if (b.textContent === hari) b.className = 'day-btn active';
    });
  }
  renderJadwal();
}

function renderJadwal() {
  if (dateSearchActive) return; // jangan override saat search tanggal aktif
  var targetHari = activeHariFilter === 'hari-ini' ? hariIniStr : activeHariFilter;
  // Tombol hari = tanggal terakhir (<= hari ini) yang jatuh pada hari tersebut
  var dk = activeHariFilter === 'hari-ini' ? todayKey() : lastDateForHari(targetHari);
  var filtered = semuaJadwal.filter(function(j) {
    return matchJadwalTanggal(j, targetHari, dk);
  });
  renderJadwalList(filtered, dk, targetHari);
}

// Jadwal bertanggal hanya tampil di tanggalnya; jadwal lama (tanpa tanggal) tetap mingguan per hari
function matchJadwalTanggal(j, hari, dk) {
  if (j.Tanggal) return j.Tanggal === dk;
  return (j.Hari || '').toLowerCase() === String(hari || '').toLowerCase();
}

function renderJadwalList(filtered, dk, labelHari) {
  currentList = filtered;
  currentDateKey = dk;
  var isFuture = dk > todayKey();
  var container = document.getElementById('jadwalContainer');
  document.getElementById('jadwalCount').textContent = filtered.length + ' jadwal';

  var tercatat = filtered.filter(function(j) {
    var st = absensiStatus[statusKey(j.ID_Jadwal, dk)];
    return st && st !== 'Ditolak';
  }).length;
  var info = '<span class="material-symbols-outlined" style="font-size:14px">event</span>' +
    'Sesi <b>' + escHtml(labelHari) + ', ' + keyToDisplay(dk) + '</b>' +
    (filtered.length ? ' &bull; ' + tercatat + '/' + filtered.length + ' sudah absen' : '');
  if (isFuture) info += ' <span class="future">Belum bisa diabsen</span>';
  document.getElementById('tanggalInfo').innerHTML = info;

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-card">' +
      '<span class="material-symbols-outlined empty-icon">event_busy</span>' +
      '<div class="empty-title">Tidak Ada Jadwal</div>' +
      '<div class="empty-sub">Tidak ada jadwal bimbingan untuk ' + escHtml(labelHari) + ' (' + keyToDisplay(dk) + ').</div>' +
      '</div>';
    return;
  }

  var html = '';
  filtered.forEach(function(j, idx) {
    var st = absensiStatus[statusKey(j.ID_Jadwal, dk)];
    var sudah = !!st && st !== 'Ditolak';
    var ditolak = st === 'Ditolak';
    var cardClass = 'jadwal-card' + (sudah ? ' sudah-absen' : (ditolak ? ' ditolak' : ''));
    var jam = (j.Jam_Mulai || '-') + (j.Jam_Selesai ? ' - ' + j.Jam_Selesai : '');

    html += '<div class="' + cardClass + '">';
    html += '<div class="jadwal-time"><span class="material-symbols-outlined" style="font-size:14px">schedule</span>' + escHtml(jam) + '</div>';
    html += '<div class="jadwal-name">' + escHtml(j.Nama_Siswa) + '</div>';
    html += '<div class="jadwal-info">';
    html += '<span>' + escHtml(j.Mata_Pelajaran) + '</span>';
    html += '<span class="jadwal-dot"></span>';
    html += '<span>' + escHtml(j.Nama_Tutor) + '</span>';
    if (j.Ruang && j.Ruang !== '-') {
      html += '<span class="jadwal-dot"></span>';
      html += '<span style="display:flex;align-items:center;gap:3px"><span class="material-symbols-outlined" style="font-size:13px">meeting_room</span>' + escHtml(j.Ruang) + '</span>';
    }
    html += '</div>';
    if (ditolak) {
      html += '<div class="abs-note"><span class="material-symbols-outlined" style="font-size:14px">error</span>Absen sebelumnya ditolak admin. Silakan absen ulang.</div>';
    }

    html += '<div class="jadwal-actions">';
    if (sudah) {
      html += '<div class="abs-done"><div class="abs-done-title"><span class="material-symbols-outlined" style="font-size:18px">check_circle</span>Absensi Tercatat</div>';
      html += '<div class="abs-done-sub">' + (st === 'Terverifikasi' ? 'Sudah diverifikasi admin' : 'Menunggu verifikasi admin') + '</div></div>';
    } else if (isFuture) {
      html += '<button class="btn-absen" disabled><span class="material-symbols-outlined" style="font-size:16px">lock_clock</span> Belum Waktunya</button>';
    } else {
      html += '<button class="btn-absen" onclick="openModalAbsensiIdx(' + idx + ')">';
      html += '<span class="material-symbols-outlined" style="font-size:16px">how_to_reg</span> ' + (ditolak ? 'Absen Ulang' : 'Isi Absen') + '</button>';
    }
    html += '<button class="btn-riwayat" onclick="openRiwayat(\'' + escAttr(j.ID_Tutor) + '\')">';
    html += '<span class="material-symbols-outlined" style="font-size:14px">history</span>Riwayat</button>';
    html += '</div>';
    html += '</div>';
  });

  container.innerHTML = html;
}

// ==============================
// MODAL ABSENSI
// ==============================
function openModalAbsensiIdx(idx) {
  var j = currentList[idx];
  if (!j) return;
  var dk = currentDateKey;
  var st = absensiStatus[statusKey(j.ID_Jadwal, dk)];
  if (st && st !== 'Ditolak') { showToast('Sesi ini sudah diabsen.', 'error'); rerender(); return; }
  if (dk > todayKey()) { showToast('Tanggal ini belum tiba.', 'error'); return; }
  openModalAbsensi(j, dk);
}

function openModalAbsensi(j, dk) {
  document.getElementById('absensi-id-jadwal').value = j.ID_Jadwal || '';
  document.getElementById('absensi-id-tutor').value = j.ID_Tutor || '';
  document.getElementById('absensi-tanggal').value = dk || todayKey();
  document.getElementById('absensi-subtitle').textContent = (j.Mata_Pelajaran||'') + ' \u2022 ' + (j.Hari||'') + ', ' + keyToDisplay(dk || todayKey()) + ' \u2022 ' + (j.Jam_Mulai||'') + (j.Jam_Selesai ? ' - ' + j.Jam_Selesai : '');
  document.getElementById('absensi-nama-tutor').value = j.Nama_Tutor || '';
  document.getElementById('absensi-nama-siswa').value = j.Nama_Siswa || '';
  document.getElementById('absensi-kelas').value = j.Kelas || '';
  document.getElementById('absensi-mapel').value = j.Mata_Pelajaran || '';
  document.getElementById('absensi-laporan').value = '';
  document.getElementById('absensi-pin').value = '';
  document.getElementById('fotoInput').value = '';
  resetUploadArea();
  setAbsensiAlert('', '');
  document.getElementById('modalAbsensi').classList.add('open');
}

function closeModal() {
  document.getElementById('modalAbsensi').classList.remove('open');
}

function resetUploadArea() {
  var area = document.getElementById('uploadArea');
  area.className = 'file-upload-area';
  var icon = area.querySelector('.file-upload-icon');
  if (icon) icon.textContent = 'add_a_photo';
  var text = area.querySelector('.file-upload-text');
  if (text) text.textContent = 'Ketuk untuk ambil/pilih foto';
  var prev = document.getElementById('fotoPreview');
  prev.style.display = 'none';
  prev.src = '';
}

function onFotoChange() {
  var file = document.getElementById('fotoInput').files[0];
  if (!file) { resetUploadArea(); return; }
  var area = document.getElementById('uploadArea');
  area.className = 'file-upload-area has-file';
  var icon = area.querySelector('.file-upload-icon');
  if (icon) icon.textContent = 'check_circle';
  var text = area.querySelector('.file-upload-text');
  if (text) text.textContent = file.name;

  var reader = new FileReader();
  reader.onload = function(e) {
    var prev = document.getElementById('fotoPreview');
    prev.src = e.target.result;
    prev.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function setAbsensiAlert(msg, type) {
  var el = document.getElementById('absensiAlert');
  if (!msg) { el.style.display = 'none'; return; }
  el.className = 'alert-box alert-' + type;
  el.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">' + (type === 'success' ? 'check_circle' : 'error') + '</span>' + escHtml(msg);
  el.style.display = 'flex';
}

function submitAbsensi() {
  var idJadwal = document.getElementById('absensi-id-jadwal').value;
  var idTutor = document.getElementById('absensi-id-tutor').value;
  var tanggalSesi = document.getElementById('absensi-tanggal').value || todayKey();
  var laporan = document.getElementById('absensi-laporan').value.trim();
  var pin = document.getElementById('absensi-pin').value.trim();
  var fileInput = document.getElementById('fotoInput');
  var file = fileInput.files[0];

  if (!file) { setAbsensiAlert('Foto dokumentasi wajib diambil/dipilih.', 'error'); return; }
  if (!laporan) { setAbsensiAlert('Laporan sesi tidak boleh kosong.', 'error'); return; }
  if (!pin) { setAbsensiAlert('PIN tutor wajib diisi.', 'error'); return; }

  var btn = document.getElementById('btnKirim');
  btn.disabled = true;
  btn.innerHTML = '<div style="width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite"></div> Mengkompresi & Mengirim...';
  setAbsensiAlert('', '');

  // Compress image
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.getElementById('compressCanvas');
      var MAX = 800;
      var w = img.width, h = img.height;
      if (w > h && w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      else if (h >= w && h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var base64 = canvas.toDataURL('image/jpeg', 0.75);

      var payload = {
        idJadwal: idJadwal,
        idTutor: idTutor,
        pinTutor: pin,
        laporan: laporan,
        base64Image: base64,
        tanggalSesi: tanggalSesi
      };

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px">send</span> Kirim Laporan';
          if (res && res.success) {
            setAbsensiAlert(res.message, 'success');
            absensiStatus[statusKey(idJadwal, res.tanggalSesi || tanggalSesi)] = 'Menunggu';
            rerender(); // langsung kunci kartu (berlaku juga di mode Cari Tanggal)
            setTimeout(function() {
              closeModal();
              showToast('Absensi berhasil disimpan!', 'success');
            }, 1200);
          } else {
            setAbsensiAlert((res && res.message) || 'Terjadi kesalahan.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px">send</span> Kirim Laporan';
          var msg = (err && err.message) || 'Coba lagi.';
          if (/sudah diabsen/i.test(msg)) {
            // Server menolak karena sudah ada absen untuk sesi ini -> kunci kartunya
            absensiStatus[statusKey(idJadwal, tanggalSesi)] = 'Menunggu';
            rerender();
            setAbsensiAlert(msg, 'error');
          } else {
            setAbsensiAlert('Gagal menyimpan: ' + msg, 'error');
          }
        })
        .submitAbsensi(payload);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ==============================
// MODAL RIWAYAT
// ==============================
function openRiwayat(idTutor) {
  document.getElementById('modalRiwayat').classList.add('open');
  document.getElementById('riwayatList').innerHTML = '<div class="loader-wrap"><div class="spinner"></div></div>';

  google.script.run
    .withSuccessHandler(renderRiwayat)
    .withFailureHandler(function(err) {
      document.getElementById('riwayatList').innerHTML = '<p style="color:#EF4444;font-size:13px;padding:20px">Gagal memuat: ' + escHtml(err.message) + '</p>';
    })
    .getRiwayatTutor(idTutor);
}

function renderRiwayat(data) {
  if (!data) return;


  var list = data.riwayat || [];
  var listEl = document.getElementById('riwayatList');
  if (list.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:40px;color:#9ca3af;font-size:13px">Belum ada riwayat mengajar.</div>';
    return;
  }
  var html = '';
  list.slice().reverse().forEach(function(r) {
    var sv = r.Status_Verifikasi || 'Menunggu';
    var dotClass = sv === 'Terverifikasi' ? 'verified' : (sv === 'Ditolak' ? 'ditolak' : 'menunggu');
    var statusClass = sv === 'Terverifikasi' ? 'status-verified' : (sv === 'Ditolak' ? 'status-ditolak' : 'status-menunggu');
    html += '<div class="sesi-item">';
    html += '<div class="sesi-dot ' + dotClass + '"></div>';
    html += '<div style="flex:1">';
    var sesiTxt = r.Tanggal_Sesi ? 'Sesi ' + keyToDisplay(String(r.Tanggal_Sesi).substring(0, 10)) + ' \u2022 ' : '';
    html += '<div class="sesi-time">' + escHtml(sesiTxt + 'Diinput ' + (r.Timestamp||'-')) + '</div>';
    html += '<div class="sesi-name">' + escHtml(r.Nama_Siswa||'-') + ' &bull; ' + escHtml(r.Nama_Tutor||'-') + '</div>';
    html += '<div class="sesi-info">' + escHtml(r.Mata_Pelajaran||'-') + ' &bull; Kelas: ' + escHtml(r.Kelas || '-') + '</div>';
    html += '</div>';
    html += '<span class="sesi-status ' + statusClass + '">' + escHtml(sv) + '</span>';
    html += '</div>';
  });
  listEl.innerHTML = html;
}

function closeRiwayat() {
  document.getElementById('modalRiwayat').classList.remove('open');
}

// ==============================
// HELPERS
// ==============================
function formatRp(n) { return Number(n||0).toLocaleString('id-ID'); }

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) { return escHtml(s); }

function showToast(msg, type) {
  var wrap = document.getElementById('toastWrap');
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + (type||'success');
  toast.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">' + (type==='error' ? 'error' : 'check_circle') + '</span>' + escHtml(msg);
  wrap.appendChild(toast);
  setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 3000);
}

// ==============================
// START
// ==============================
document.addEventListener('DOMContentLoaded', function() { loadJadwal(); });
</script>
